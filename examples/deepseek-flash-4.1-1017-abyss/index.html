<!doctype html>
<html lang="zh-CN">
<head>

  <main id="player">
    <header class="toolbar"><strong id="project-title">HTML 视频</strong><nav><a href="?format=landscape">横屏</a><a href="?format=portrait">竖屏</a></nav></header>
    <div id="viewport"><div id="stage" aria-label="视频画面"></div></div>

    <div id="chapters" aria-label="章节"></div>
    <p id="status" role="status">正在准备画面…</p>

  </main>
  <script src="timeline.js"></script>
